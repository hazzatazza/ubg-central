<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBG Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #38bdf8; 
            --bg: #0f172a; 
            --card: #1e293b; 
            --card-border: #334155; 
        }
        body { 
            background-color: var(--bg); 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 50px;
        }
        .game-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            transition: all 0.2s ease;
        }
        .game-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body class="p-6">

    <!-- Header -->
    <header class="max-w-6xl mx-auto flex justify-between items-center bg-slate-800/60 backdrop-blur-md border border-slate-700 p-4 rounded-2xl mb-8">
        <div class="flex items-center gap-3">
            <i class="fas fa-gamepad text-2xl text-sky-400"></i>
            <h1 class="text-2xl font-bold tracking-wide">UBG Central</h1>
        </div>
        <div class="flex items-center gap-4">
            <input type="text" id="searchInput" placeholder="Search games..." class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-sky-400 text-white">
            <button onclick="openModal()" class="bg-sky-400 text-slate-950 px-4 py-2 rounded-xl font-bold hover:opacity-90 transition">+ Add Game</button>
        </div>
    </header>

    <!-- Game Grid -->
    <main class="max-w-6xl mx-auto">
        <div id="gameGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <p class="text-slate-400 col-span-full">Loading games...</p>
        </div>
    </main>

    <!-- Add Game Modal -->
    <div id="gameModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-sky-400">Add New Game</h2>
            <form onsubmit="submitGame(event)">
                <div class="mb-4">
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Game Title</label>
                    <input type="text" id="gameTitle" required class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-white text-sm focus:outline-none focus:border-sky-400" placeholder="e.g. Retro Bowl">
                </div>
                <div class="mb-4">
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Thumbnail Image URL</label>
                    <input type="url" id="gameIcon" required class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-white text-sm focus:outline-none focus:border-sky-400" placeholder="https://example.com/icon.png">
                </div>
                <div class="mb-4">
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Submission Type</label>
                    <select id="gameType" onchange="toggleLabel()" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-white text-sm focus:outline-none focus:border-sky-400">
                        <option value="url">External Link / Embed URL</option>
                        <option value="code">Raw HTML Code</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label id="contentLabel" class="block text-xs uppercase font-semibold text-slate-400 mb-1">Game URL</label>
                    <textarea id="gameContent" rows="3" required class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-white text-sm focus:outline-none focus:border-sky-400" placeholder="https://example.com/game/index.html"></textarea>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-700">Cancel</button>
                    <button type="submit" id="submitBtn" class="bg-sky-400 text-slate-950 px-5 py-2 rounded-xl text-sm font-bold hover:opacity-90">Publish</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Play Game Modal -->
    <div id="playModal" class="fixed inset-0 bg-black/95 hidden flex flex-col z-50">
        <div class="flex justify-between items-center px-6 py-3 bg-slate-900 border-b border-slate-800">
            <h3 id="playTitle" class="font-bold text-lg text-white"></h3>
            <button onclick="closePlayModal()" class="text-slate-400 hover:text-white text-xl"><i class="fas fa-times"></i></button>
        </div>
        <div class="flex-1 w-full h-full">
            <iframe id="gameIframe" class="w-full h-full border-none"></iframe>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://ubgcentralkeys.gdharry123.workers.dev/";
        let gamesList = [];

        async function loadGames() {
            const grid = document.getElementById('gameGrid');
            try {
                const res = await fetch('games.json?t=' + Date.now());
                if (!res.ok) throw new Error("Failed to load");
                gamesList = await res.json();

                if (gamesList.length === 0) {
                    grid.innerHTML = `<p class="text-slate-400 col-span-full">No games added yet. Click "+ Add Game" to get started!</p>`;
                    return;
                }

                grid.innerHTML = '';
                gamesList.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card rounded-2xl overflow-hidden cursor-pointer flex flex-col';
                    card.onclick = () => openPlayModal(game.url, game.title);
                    card.innerHTML = `
                        <div class="aspect-square w-full bg-slate-800 overflow-hidden">
                            <img src="${game.thumb}" alt="${game.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
                        </div>
                        <div class="p-3 text-center truncate">
                            <span class="text-sm font-semibold truncate block">${game.title}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                grid.innerHTML = `<p class="text-red-400 col-span-full">Error loading games. Make sure games.json is in your repository.</p>`;
            }
        }

        function openModal() { document.getElementById('gameModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('gameModal').classList.add('hidden'); }

        function openPlayModal(url, title) {
            document.getElementById('playTitle').textContent = title;
            document.getElementById('gameIframe').src = url;
            document.getElementById('playModal').classList.remove('hidden');
        }

        function closePlayModal() {
            document.getElementById('playModal').classList.add('hidden');
            document.getElementById('gameIframe').src = '';
        }

        function toggleLabel() {
            const type = document.getElementById('gameType').value;
            const label = document.getElementById('contentLabel');
            label.textContent = type === 'code' ? 'HTML Game Code' : 'Game URL';
        }

        async function submitGame(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Publishing...';
            btn.disabled = true;

            const title = document.getElementById('gameTitle').value;
            const iconUrl = document.getElementById('gameIcon').value;
            const type = document.getElementById('gameType').value;
            const content = document.getElementById('gameContent').value;

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, iconUrl, type, content })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to publish');

                alert('Game published successfully!');
                closeModal();
                loadGames();
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.textContent = 'Publish';
                btn.disabled = false;
            }
        }

        document.getElementById('searchInput').oninput = (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = gamesList.filter(g => g.title.toLowerCase().includes(query));
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            
            if (filtered.length === 0) {
                grid.innerHTML = `<p class="text-slate-400 col-span-full">No games found.</p>`;
                return;
            }

            filtered.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card rounded-2xl overflow-hidden cursor-pointer flex flex-col';
                card.onclick = () => openPlayModal(game.url, game.title);
                card.innerHTML = `
                    <div class="aspect-square w-full bg-slate-800 overflow-hidden">
                        <img src="${game.thumb}" alt="${game.title}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-3 text-center truncate">
                        <span class="text-sm font-semibold truncate block">${game.title}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        loadGames();
    </script>
</body>
</html>
